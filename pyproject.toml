[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "metal_refinery_tz"
version = "16.0.0"
description = "Precious metal refinery operations companion app for ERPNext v16"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Aakvatech Limited", email = "info@aakvatech.com"}
]
dependencies = []

[project.urls]
Repository = "https://github.com/Aakvatech-Limited/metal_refinery_tz"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
