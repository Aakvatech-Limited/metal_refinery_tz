name: Frappe application static checks

on:
  push:
    branches: [version-16, version-16-hotfix]
  pull_request:
    branches: [version-16, version-16-hotfix]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python, JSON, links, and navigation sources
        run: python scripts/validate_app_sources.py
      - name: Verify package metadata
        run: python -m compileall -q metal_refinery_tz
